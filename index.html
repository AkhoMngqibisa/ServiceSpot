<!doctype html>
<html lang="en">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ServiceSpot - Local Community Marketplace</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
  />
  <link rel="stylesheet" href="./css/style.css" />

  <head></head>

  <body>
    <script src="/js/app.js"></script>
    <script src="/js/ui.js"></script>
    <!-- Header -->
    <header>
      <div class="container">
        <nav>
          <a href="#" class="logo">
            <i class="fas fa-map-marker-alt"></i> ServiceSpot
          </a>
          <button class="btn btn-primary" id="addService" onclick="openAddServiceModal()">
            <i class="fas fa-plus"></i> Post a Service
          </button>
        </nav>
      </div>
    </header>
    <!-- Main Content -->
    <main>
      <section class="hero">
        <div class="container">
          <h1>Find Local Help or Share Your Skills</h1>
          <p>
            Connect with neighbors for barbers, salons, tutoring, repairs, and
            more. <br />No middleman, just community.
          </p>
        </div>
      </section>
      <section class="container">
        <div class="controls">
          <div class="search-bar">
            <i class="fa fa-search"></i>
            <input
              type="text"
              id="searchInput"
              placeholder="Search services (e.g. Haircut, Salon)..."
            />
          </div>
          <div class="filter-group" id="categoryFilters">
            <button class="filter-btn active" data-category="All">All</button>
            <button class="filter-btn" data-category="Salon">Salon</button>
            <button class="filter-btn" data-category="Barber">Barber</button>
            <button class="filter-btn" data-category="HomeRepairs">
              Home Repairs
            </button>
            <button class="filter-btn" data-category="Tutor">Tutor</button>
          </div>
        </div>

        <!-- Services List Grid -->
        <div class="grid" id="servicesGrid">
          <!-- Items will be injected here via JS -->
        </div>

        <!-- Add Service Modal (Form) -->
        <div class="modal-overlay" id="modalOverlay">
          <div class="modal">
            <div class="modal-header">
              <h2>Advertise a Service</h2>
              <button class="close-modal" id="closeModalBtn">&times;</button>
            </div>
            <form id="addServiceForm">
              <div class="form-group">
                <label for="title">Service Title</label>
                <input type="text" id="title" placeholder="e.g Professional Haircut" required/>
              </div>
              <div class="form-group">
                <label for="category">Category</label>
                <select id="category" required>
                  <option value="Barber">Barber</option>
                  <option value="Salom">Salon</option>
                  <option value="Home">Home Repairs</option>
                  <option value="Tutor">Tutoring</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="form-group">
                <label for="provider">Provider Name</label>
                <input type="text" id="provider" placeholder="e.g John Hill" required/>
              </div>
              <div class="form-group">
                <label for="price">Price (R)</label>
                <input type="text" id="price" placeholder="e.g R20 or Negotiable" required/>
              </div>
              <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" placeholder="Describe your service, experience, and location..." required></textarea>
              </div>
              <div class="form-group">
                <label for="image">Image URL (Optional)</label>
                <input type="url" id="image" placeholder="Leave empty for a random image"/>
                <small style="color: #64748b; font-size: 0.8rem">
                  Uses a random image if left blank.
                </small>
              </div>

            </form>
          </div>
        </div>

        <!-- Toast Container -->
        <div class="toast-container" id="toastContainer"></div>
      </section>
    </main>
  </body>
</html>
